<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4);justify-content:space-around;align-items:center">
      <div class="col" style="align-items:center;gap:8px"><img src="../assets/logos/emblem-orange-circle.svg" style="width:140px;height:140px"><span class="token">app icon &middot; orange</span></div>
      <div class="col" style="align-items:center;gap:8px"><img src="../assets/logos/emblem-white-circle.svg" style="width:140px;height:140px;border:1px solid var(--ez-keyline);border-radius:50%"><span class="token">white &middot; favicon</span></div>
      <div class="col" style="align-items:center;gap:8px">
        <div style="width:140px;height:140px;background:radial-gradient(circle at 30% 30%, #2a1a17, #491211);display:grid;place-items:center;border-radius:50%"><img src="../assets/logos/emblem-pattern-only.svg" style="width:90px;height:90px"></div>
        <span class="token">on dark photo</span>
      </div>
    </div>
  </div>
</body></html>
