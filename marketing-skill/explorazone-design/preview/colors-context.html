<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card" style="padding:0;overflow:hidden">
    <div class="row" style="gap:0">
      <div style="flex:1;background:#ED4724;color:#491211;padding:var(--ez-space-5) var(--ez-space-6);min-height:152px;display:flex;flex-direction:column;justify-content:space-between">
        <span style="font-family:var(--ez-font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#491211">On Orange Field</span>
        <div>
          <div style="font-family:var(--ez-font-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:#fff;line-height:1.05">Half-term Reset</div>
          <div style="font-family:var(--ez-font-body);font-size:13px;color:#491211;margin-top:6px">Maroon #491211 / Green #99CC67 / White wordmark.</div>
        </div>
        <div class="row" style="gap:6px">
          <span style="display:inline-block;width:16px;height:16px;background:#491211;border-radius:3px"></span>
          <span style="display:inline-block;width:16px;height:16px;background:#99CC67;border-radius:3px"></span>
          <span style="display:inline-block;width:16px;height:16px;background:#FFFFFF;border-radius:3px"></span>
        </div>
      </div>
      <div style="flex:1;background:#FFFFFF;color:#561F1C;padding:var(--ez-space-5) var(--ez-space-6);min-height:152px;display:flex;flex-direction:column;justify-content:space-between">
        <span style="font-family:var(--ez-font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#ED4724">On White Field</span>
        <div>
          <div style="font-family:var(--ez-font-display);font-size:22px;text-transform:uppercase;letter-spacing:.02em;color:#561F1C;line-height:1.05">Book a Visit</div>
          <div style="font-family:var(--ez-font-body);font-size:13px;color:#561F1C;margin-top:6px">Maroon #561F1C / Green #A7CF38 / Orange brand.</div>
        </div>
        <div class="row" style="gap:6px">
          <span style="display:inline-block;width:16px;height:16px;background:#561F1C;border-radius:3px"></span>
          <span style="display:inline-block;width:16px;height:16px;background:#A7CF38;border-radius:3px"></span>
          <span style="display:inline-block;width:16px;height:16px;background:#ED4724;border-radius:3px"></span>
        </div>
      </div>
    </div>
  </div>
</body></html>
