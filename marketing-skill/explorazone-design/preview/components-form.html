<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="align-items:flex-start;gap:var(--ez-space-4)">
      <div style="flex:1">
        <label style="display:block;font-family:var(--ez-font-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#561F1C;margin-bottom:6px">School name</label>
        <input value="Bowthorpe Primary" style="display:block;width:100%;padding:12px 14px;font-family:var(--ez-font-body);font-size:15px;color:#561F1C;background:#fff;border:1px solid rgba(73,18,17,0.24);border-radius:8px;outline:none;box-sizing:border-box">
      </div>
      <div style="flex:1">
        <label style="display:block;font-family:var(--ez-font-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#561F1C;margin-bottom:6px">Pupils</label>
        <input value="60" style="display:block;width:100%;padding:12px 14px;font-family:var(--ez-font-body);font-size:15px;color:#561F1C;background:#fff;border:2px solid #ED4724;border-radius:8px;outline:none;box-shadow:0 0 0 3px rgba(237,71,36,0.18);box-sizing:border-box">
        <div style="font-family:var(--ez-font-body);font-size:11px;color:#ED4724;margin-top:4px">Focus state</div>
      </div>
    </div>
    <div class="row" style="margin-top:var(--ez-space-3);gap:var(--ez-space-3)">
      <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(167,207,56,0.18);color:#5a7a08;border-radius:999px;font-family:var(--ez-font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase">✓ Confirmed</span>
      <span style="display:inline-flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(237,71,36,0.10);color:#ED4724;border-radius:999px;font-family:var(--ez-font-display);font-size:11px;letter-spacing:.06em;text-transform:uppercase">SEND friendly</span>
    </div>
  </div>
</body></html>
