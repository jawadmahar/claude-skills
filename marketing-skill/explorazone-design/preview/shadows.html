<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body style="background:#FAF7F3">
  <div class="card" style="background:#FAF7F3;border:0;box-shadow:none;padding:var(--ez-space-8) var(--ez-space-6)">
    <div class="row" style="gap:var(--ez-space-6);justify-content:space-around">
      <div class="col" style="gap:var(--ez-space-2);align-items:center">
        <div style="width:96px;height:64px;background:#fff;border-radius:12px;box-shadow:0 1px 2px rgba(73,18,17,0.06)"></div>
        <span class="token">shadow-1</span><span class="token">resting</span>
      </div>
      <div class="col" style="gap:var(--ez-space-2);align-items:center">
        <div style="width:96px;height:64px;background:#fff;border-radius:12px;box-shadow:0 2px 6px rgba(73,18,17,0.08), 0 1px 2px rgba(73,18,17,0.04)"></div>
        <span class="token">shadow-2</span><span class="token">card</span>
      </div>
      <div class="col" style="gap:var(--ez-space-2);align-items:center">
        <div style="width:96px;height:64px;background:#fff;border-radius:12px;box-shadow:0 8px 24px rgba(73,18,17,0.12), 0 2px 4px rgba(73,18,17,0.06)"></div>
        <span class="token">shadow-3</span><span class="token">hover / popover</span>
      </div>
      <div class="col" style="gap:var(--ez-space-2);align-items:center">
        <div style="width:96px;height:64px;background:#fff;border-radius:12px;box-shadow:0 16px 40px rgba(73,18,17,0.16)"></div>
        <span class="token">shadow-4</span><span class="token">modal</span>
      </div>
    </div>
  </div>
</body></html>
