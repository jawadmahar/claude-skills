<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4);align-items:flex-end">
      <div class="col" style="gap:6px;align-items:center"><div style="width:36px;height:36px;background:#ED4724;border-radius:0"></div><span class="token">none</span><span class="token">0</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:36px;height:36px;background:#ED4724;border-radius:4px"></div><span class="token">sm</span><span class="token">4px</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:36px;height:36px;background:#ED4724;border-radius:8px"></div><span class="token">md</span><span class="token">8px</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:36px;height:36px;background:#ED4724;border-radius:16px"></div><span class="token">lg</span><span class="token">16px</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:36px;height:36px;background:#ED4724;border-radius:24px"></div><span class="token">xl</span><span class="token">24px</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:36px;background:#ED4724;border-radius:999px"></div><span class="token">pill</span><span class="token">999px</span></div>
      <div class="grow"></div>
      <div class="col" style="gap:2px;align-items:flex-end;font-family:var(--ez-font-body);font-size:12px;color:#561F1C">
        <div><b>md</b> &middot; buttons, inputs</div>
        <div><b>lg</b> &middot; cards, surfaces</div>
        <div><b>pill</b> &middot; tags only</div>
      </div>
    </div>
  </div>
</body></html>
