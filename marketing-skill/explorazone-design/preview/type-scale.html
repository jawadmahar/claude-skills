<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="col" style="gap:var(--ez-space-2)">
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">3xl</div><div style="font-family:var(--ez-font-display);font-size:48px;text-transform:uppercase;color:#561F1C;line-height:1">Headline</div><div class="token grow" style="text-align:right">56px / display / -0.02em</div></div>
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">2xl</div><div style="font-family:var(--ez-font-display);font-size:34px;text-transform:uppercase;color:#561F1C;line-height:1">Section</div><div class="token grow" style="text-align:right">40px / display</div></div>
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">xl</div><div style="font-family:var(--ez-font-display);font-size:24px;text-transform:uppercase;color:#561F1C;line-height:1">Subhead</div><div class="token grow" style="text-align:right">28px / display</div></div>
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">base</div><div style="font-family:var(--ez-font-body);font-size:16px;color:#561F1C;line-height:1.3">Body copy, default 16px</div><div class="token grow" style="text-align:right">16px / body / 1.5</div></div>
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">sm</div><div style="font-family:var(--ez-font-body);font-size:14px;color:#561F1C;line-height:1.3">Meta &middot; captions</div><div class="token grow" style="text-align:right">14px / body</div></div>
      <div class="row" style="align-items:baseline;gap:var(--ez-space-4)"><div style="width:60px;font-family:var(--ez-font-display);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#ED4724">xs</div><div style="font-family:var(--ez-font-body);font-size:12px;color:#561F1C;line-height:1.3">Eyebrow &middot; tags</div><div class="token grow" style="text-align:right">12px / display tracked 0.08em</div></div>
    </div>
  </div>
</body></html>
