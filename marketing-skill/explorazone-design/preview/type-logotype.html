<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-5);align-items:stretch">
      <div style="flex:0 0 auto;background:#ED4724;border-radius:var(--ez-radius-md);padding:var(--ez-space-4);display:grid;place-items:center;width:300px">
        <img src="../assets/logos/explorazone-orange.png" alt="EXPLORAZONE wordmark" style="width:100%;height:auto;display:block">
      </div>
      <div class="col grow" style="justify-content:center">
        <p class="ez-eyebrow" style="margin:0;color:#ED4724">Logotype &middot; Astrii</p>
        <p style="margin:0;font-family:var(--ez-font-body);font-size:13px;color:#561F1C;line-height:1.4">
          Astrii is the pixel-grid wordmark face. Reserved. Place the supplied SVG, never re-type EXPLORAZONE in this font in body or headings.
        </p>
        <div class="row" style="gap:var(--ez-space-2);margin-top:4px">
          <span class="tag" style="background:rgba(167,207,56,0.18);color:#5a7a08">Wordmark only</span>
          <span class="token">--ez-font-logotype</span>
        </div>
      </div>
    </div>
  </div>
</body></html>
