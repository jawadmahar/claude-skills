<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--ez-space-4);width:700px">
    <article class="card" style="margin:0">
      <p class="ez-eyebrow" style="margin:0 0 6px;color:#ED4724">For Schools</p>
      <h3 class="ez-heading" style="margin:0 0 6px;color:#561F1C;font-size:20px">Curriculum-linked Trips</h3>
      <p style="margin:0;color:#561F1C;font-size:14px;line-height:1.5">£18 per pupil. Risk assessments and teacher prep pack included.</p>
      <div style="margin-top:14px"><a style="display:inline-block;padding:10px 18px;background:#fff;color:#ED4724;border:2px solid #ED4724;border-radius:8px;font-family:var(--ez-font-display);text-transform:uppercase;font-size:13px;letter-spacing:.06em;text-decoration:none">Book a Trip</a></div>
    </article>
    <article style="background:#ED4724;color:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 6px rgba(73,18,17,0.08)">
      <p style="margin:0 0 6px;font-family:var(--ez-font-display);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#491211">Half-term Reset</p>
      <h3 style="margin:0 0 6px;font-family:var(--ez-font-display);text-transform:uppercase;font-size:20px;letter-spacing:-0.01em;line-height:1.05">£5 off Your Next Visit</h3>
      <p style="margin:0;color:#491211;font-size:14px;line-height:1.5">Show the voucher at the door. Valid Mon-Fri.</p>
    </article>
  </div>
</body></html>
