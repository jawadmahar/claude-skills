<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4)">
      <div class="swatch" style="flex:1">
        <div class="chip" style="background:#491211;display:grid;place-items:center;color:#ED4724;font-family:var(--ez-font-display);text-transform:uppercase;letter-spacing:.08em">on orange</div>
        <div class="meta">
          <p class="name">Maroon / On Orange</p>
          <div class="hex">#491211 &middot; descriptor & text on the brand field</div>
        </div>
      </div>
      <div class="swatch" style="flex:1">
        <div class="chip" style="background:#561F1C;display:grid;place-items:center;color:#fff;font-family:var(--ez-font-display);text-transform:uppercase;letter-spacing:.08em">on white</div>
        <div class="meta">
          <p class="name">Maroon / On White <span class="tag">default body</span></p>
          <div class="hex">#561F1C &middot; body, headings on white</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
