<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4);justify-content:space-around;align-items:center">
      <div class="col" style="align-items:center;gap:8px"><div style="width:140px;height:140px;background:#ED4724;display:grid;place-items:center;border-radius:12px"><img src="../assets/logos/emblem-orange-square.svg" style="width:100%;height:100%"></div><span class="token">orange field</span></div>
      <div class="col" style="align-items:center;gap:8px"><div style="width:140px;height:140px;background:#fff;border:1px solid var(--ez-keyline);display:grid;place-items:center;border-radius:12px"><img src="../assets/logos/emblem-pattern-only.svg" style="width:100%;height:100%;padding:6px;box-sizing:border-box"></div><span class="token">on white</span></div>
      <div class="col" style="align-items:center;gap:8px"><div style="width:140px;height:140px;background:#561F1C;display:grid;place-items:center;border-radius:12px"><img src="../assets/logos/emblem-pattern-only.svg" style="width:100%;height:100%;padding:6px;box-sizing:border-box"></div><span class="token">on maroon</span></div>
    </div>
  </div>
</body></html>
