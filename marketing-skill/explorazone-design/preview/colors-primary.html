<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row">
      <div class="swatch">
        <div class="chip" style="background:#ED4724"></div>
        <div class="meta">
          <p class="name">Primary Orange</p>
          <div class="hex">#ED4724 &middot; rgb(237 71 36)</div>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#FFFFFF;border-bottom:1px solid var(--ez-keyline)"></div>
        <div class="meta">
          <p class="name">Surface White</p>
          <div class="hex">#FFFFFF</div>
        </div>
      </div>
      <div class="swatch">
        <div class="chip" style="background:#ED4724;position:relative">
          <div style="position:absolute;inset:0;display:grid;place-items:center;font-family:var(--ez-font-display);text-transform:uppercase;color:#fff;font-size:18px;letter-spacing:.08em">Hero</div>
        </div>
        <div class="meta">
          <p class="name">In Use</p>
          <div class="hex">brand field</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
