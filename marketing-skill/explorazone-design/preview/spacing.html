<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4);align-items:flex-end">
      <div class="col" style="gap:6px;align-items:center"><div style="width:4px;height:32px;background:#ED4724"></div><span class="token">1</span><span class="token">4</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:8px;height:32px;background:#ED4724"></div><span class="token">2</span><span class="token">8</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:12px;height:32px;background:#ED4724"></div><span class="token">3</span><span class="token">12</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:16px;height:32px;background:#ED4724"></div><span class="token">4</span><span class="token">16</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:24px;height:32px;background:#ED4724"></div><span class="token">6</span><span class="token">24</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:32px;height:32px;background:#ED4724"></div><span class="token">8</span><span class="token">32</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:48px;height:32px;background:#ED4724"></div><span class="token">12</span><span class="token">48</span></div>
      <div class="col" style="gap:6px;align-items:center"><div style="width:64px;height:32px;background:#ED4724"></div><span class="token">16</span><span class="token">64</span></div>
      <div class="grow"></div>
      <div class="col" style="gap:2px;align-items:flex-end;font-family:var(--ez-font-body);font-size:12px;color:#561F1C">
        <div>4px base grid</div>
        <div>generous white space</div>
      </div>
    </div>
  </div>
</body></html>
