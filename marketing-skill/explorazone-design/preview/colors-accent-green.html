<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-4)">
      <div class="swatch" style="flex:1">
        <div class="chip" style="background:#ED4724;position:relative">
          <div style="position:absolute;inset:0;display:grid;place-items:center">
            <div style="width:34px;height:34px;background:#99CC67;border-radius:6px"></div>
          </div>
        </div>
        <div class="meta">
          <p class="name">Green / On Orange</p>
          <div class="hex">#99CC67 &middot; X-accent on brand field</div>
        </div>
      </div>
      <div class="swatch" style="flex:1">
        <div class="chip" style="background:#FFFFFF;position:relative;border-bottom:1px solid var(--ez-keyline)">
          <div style="position:absolute;inset:0;display:grid;place-items:center">
            <div style="width:34px;height:34px;background:#A7CF38;border-radius:6px"></div>
          </div>
        </div>
        <div class="meta">
          <p class="name">Green / On White <span class="tag">default accent</span></p>
          <div class="hex">#A7CF38 &middot; digital accent, success</div>
        </div>
      </div>
    </div>
  </div>
</body></html>
