<!doctype html>
<html lang="en-GB"><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.btn { display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;font-family:var(--ez-font-display);font-weight:900;font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;border-radius:8px;cursor:pointer;transition:filter .15s, transform .08s; line-height:1}
.btn-primary { background:#ED4724;color:#fff }
.btn-secondary { background:#fff;color:#ED4724;border:2px solid #ED4724;padding:10px 20px }
.btn-accent { background:#A7CF38;color:#561F1C }
.btn-ghost { background:transparent;color:#561F1C }
.btn-sm { padding:8px 14px;font-size:12px }
.btn-lg { padding:16px 28px;font-size:16px }
</style></head>
<body>
  <div class="card">
    <div class="row" style="gap:var(--ez-space-3)">
      <a class="btn btn-primary">Book a Visit</a>
      <a class="btn btn-secondary">Plan a Trip</a>
      <a class="btn btn-accent">Birthday Parties</a>
      <a class="btn btn-ghost">Learn more →</a>
    </div>
    <div class="row" style="gap:var(--ez-space-3);margin-top:var(--ez-space-3);align-items:center">
      <a class="btn btn-primary btn-sm">Small</a>
      <a class="btn btn-primary">Default</a>
      <a class="btn btn-primary btn-lg">Large</a>
      <span class="token" style="margin-left:auto">FF Clan Pro Black &middot; all caps &middot; tracking 0.06em</span>
    </div>
  </div>
</body></html>
